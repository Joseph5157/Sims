[variables]
APP_ENV = "production"
LOG_CHANNEL = "stderr"
# Build-time placeholder only — set the real APP_KEY in Railway environment variables
APP_KEY = "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build",
    "php artisan octane:install --server=frankenphp --no-interaction",
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=${PORT:-8000}"
