[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.xml",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "php84Extensions.gd",
    "php84Extensions.intl",
    "php84Extensions.exif",
    "php84Extensions.bcmath",
    "php84Extensions.pcntl",
    "composer",
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
    "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/framework/testing storage/logs bootstrap/cache",
    "chmod -R 775 storage bootstrap/cache",
]

[phases.deploy]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
