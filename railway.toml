# Queue worker — add a second Railway service pointing at the same repo with:
#   Start Command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
# It shares the same DB and picks up jobs from the `jobs` table.
# For tenant-aware jobs (mail, notifications) the worker needs no extra config;
# Stancl/Tenancy bootstraps the tenant from the job payload automatically.

[deploy]
startCommand = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=${PORT:-8000}"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
